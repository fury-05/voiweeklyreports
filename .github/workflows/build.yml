name: Build VOI Reports

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Validate report structure
      run: python scripts/validate_structure.py

    - name: Build reports.json
      run: python scripts/build_reports.py

    - name: Commit reports.json if changed
      run: |
        git config user.name "voi-bot"
        git config user.email "voi-bot@users.noreply.github.com"

        git add data/reports.json

        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update reports.json"
          git push
        fi
