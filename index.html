<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOI Reports Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0b0f14;
  color: #e5e7eb;
  margin: 0;
  padding: 2rem;
}

h1 {
  font-size: 2rem;
  margin-bottom: 1rem;
}

.year {
  margin-top: 2rem;
}

.month {
  margin-left: 1rem;
  margin-top: 1rem;
}

.period {
  margin-left: 2rem;
  padding: 0.5rem;
  border-left: 3px solid #374151;
  margin-bottom: 0.5rem;
}

.status {
  font-size: 0.8rem;
  margin-left: 0.5rem;
}

.complete { color: #22c55e; }
.partial  { color: #eab308; }
.empty    { color: #9ca3af; }

.category {
  margin-left: 1rem;
}

button {
  background: #1f2933;
  border: 1px solid #374151;
  color: #e5e7eb;
  padding: 0.3rem 0.6rem;
  margin-right: 0.5rem;
  cursor: pointer;
}

button:hover {
  background: #374151;
}

pre {
  background: #020617;
  padding: 1rem;
  overflow-x: auto;
  white-space: pre-wrap;
  margin-top: 1rem;
}
</style>
</head>

<body>

<h1>VOI Transparency & Activity Reports</h1>

<div id="app">Loading reports…</div>

<pre id="viewer" hidden></pre>

<script>
const DATA_URL = "data/reports.json";


function groupReports(data) {
  const map = {};
  data.forEach(r => {
    map[r.year] ??= {};
    map[r.year][r.month] ??= {};
    map[r.year][r.month][r.period] ??= {};
    map[r.year][r.month][r.period][r.category] = r;
  });
  return map;
}

function periodStatus(periodObj) {
  const keys = Object.keys(periodObj);
  if (keys.length === 0) return "empty";
  if (keys.length < 3) return "partial";
  return "complete";
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (!data.length) {
    app.innerHTML = "<p>No reports published yet.</p>";
    return;
  }

  const grouped = groupReports(data);

  Object.keys(grouped).sort().forEach(year => {
    const yDiv = document.createElement("div");
    yDiv.className = "year";
    yDiv.innerHTML = `<h2>${year}</h2>`;

    Object.keys(grouped[year]).sort().forEach(month => {
      const mDiv = document.createElement("div");
      mDiv.className = "month";
      mDiv.innerHTML = `<h3>${month}</h3>`;

      Object.keys(grouped[year][month]).sort().forEach(period => {
        const pObj = grouped[year][month][period];
        const status = periodStatus(pObj);

        const pDiv = document.createElement("div");
        pDiv.className = "period";
        pDiv.innerHTML = `
          <strong>${period}</strong>
          <span class="status ${status}">(${status})</span>
        `;

        Object.keys(pObj).forEach(cat => {
          const btn = document.createElement("button");
          btn.textContent = cat;
          btn.onclick = () => {
            const viewer = document.getElementById("viewer");
            viewer.hidden = false;
            viewer.textContent = pObj[cat].content;
          };
          pDiv.appendChild(btn);
        });

        mDiv.appendChild(pDiv);
      });

      yDiv.appendChild(mDiv);
    });

    app.appendChild(yDiv);
  });
}

fetch(DATA_URL)
  .then(r => r.ok ? r.json() : [])
  .then(render)
  .catch(() => {
    document.getElementById("app").innerHTML =
      "<p>Unable to load reports.json</p>";
  });
</script>

</body>
</html>
